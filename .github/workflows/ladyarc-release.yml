name: Ladyarc browser build

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/ladyarc-release.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ladyarc-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            arch: x86_64
            runner: ubuntu-24.04
            container: ghcr.io/ladybirdbrowser/ladybird-ci:2026.11.21
          - platform: macOS
            arch: arm64
            runner: xcode-27
            container: null
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          os: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          build_preset: Distribution
          use_caches: 'false'

      - name: Restore compiled dependencies
        id: dependencies
        uses: actions/cache/restore@v6
        with:
          path: Build/caches/vcpkg-binary-cache
          key: ladyarc-v1-${{ matrix.runner }}-${{ matrix.arch }}-${{ hashFiles('vcpkg*.json', 'Meta/CMake/vcpkg/**', '.github/actions/setup/action.yml') }}
          restore-keys: ladyarc-v1-${{ matrix.runner }}-${{ matrix.arch }}-

      - name: Configure the browser
        env:
          CC: clang
          CXX: clang++
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          source_url=""
          if [[ -n "$RELEASE_TAG" ]]; then
            source_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/ladyarc-$PLATFORM-$ARCH-third-party-sources.tar"
          fi
          cmake --preset Distribution -B Build \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            "-DPython3_EXECUTABLE=$pythonLocation/bin/python" \
            "-DLADYARC_SOURCE_BUNDLE_URL=$source_url" -DLADYBIRD_ENABLE_UPDATE_CHECK=OFF -DLADYBIRD_BASELINE_CPU_TARGET=ON \
            "-DLADYBIRD_VERSION=$version" -DBUILD_TESTING=OFF \
            -DLADYBIRD_ENABLE_LTO=OFF -DLADYBIRD_GENERATE_SYMBOL_FILES=OFF

      - name: Save compiled dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: Build/caches/vcpkg-binary-cache
          key: ${{ steps.dependencies.outputs.cache-primary-key }}

      - name: Compile the desktop UI and Hub interfaces first
        run: |
          ninja -C Build -t targets all > "$RUNNER_TEMP/ninja-targets"
          awk -F': ' '/(UI\/Qt|Services\/Hub)\/CMakeFiles\/.*\.o: CXX/ { print $1 }' \
            "$RUNNER_TEMP/ninja-targets" > "$RUNNER_TEMP/desktop-objects"
          test -s "$RUNNER_TEMP/desktop-objects"
          xargs ninja -C Build -j3 -k8 < "$RUNNER_TEMP/desktop-objects"

      - name: Build the browser and its services
        run: cmake --build Build --parallel 3

      - name: Package the browser
        working-directory: Build
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          cmake --install . --prefix "$PWD/runtime" --component ladybird_Runtime
          python3 ../Meta/package-ladyarc.py runtime dist "$PLATFORM" "$ARCH"

      - name: Exercise shared and isolated Spaces in one window
        if: matrix.platform == 'Linux'
        run: |
          cmake -S . -B Build -DBUILD_TESTING=ON
          cmake --build Build --parallel 3 --target TestLadyarcSpaceProfiles
          ctest --test-dir Build --output-on-failure --no-tests=error -R '^test-ladyarc-space-profiles$'

      - name: Collect corresponding third-party sources
        if: github.event_name == 'release'
        working-directory: Build
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          cmake --build . --target third_party_sources
          mv third-party-sources.tar "dist/ladyarc-$PLATFORM-$ARCH-third-party-sources.tar"

      - uses: actions/upload-artifact@v7
        with:
          name: ladyarc-${{ matrix.platform }}-${{ matrix.arch }}
          path: Build/dist/
          compression-level: 0
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: ladyarc-*
          merge-multiple: true
          path: dist

      - name: Attach packages to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        working-directory: dist
        run: |
          sha256sum ./*.tar* > SHA256SUMS
          gh release upload "$TAG" ./*.tar* SHA256SUMS --clobber
